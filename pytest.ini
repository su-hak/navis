[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 로깅 설정
log_cli = false
log_level = WARNING

# 출력 설정
addopts =
    -v
    --tb=short
    --strict-markers
    -q

# 마커 정의
markers =
    backtest: 백테스트 테스트
    paper_trading: 페이퍼 트레이딩 테스트
    error_cases: 오류 케이스 테스트
    integration: 통합 테스트
    slow: 실행 시간이 긴 테스트

# 경고 처리
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
